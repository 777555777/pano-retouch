<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pano-retouch – UX Mockup v1</title>
<style>
:root{
  --bg:#0e0f11;
  --panel:rgba(24,25,29,.86);
  --panel-solid:#18191d;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.14);
  --text:#e9e9ec;
  --muted:#8d8f98;
  --faint:#5d5f68;
  --accent:#f5b83d;
  --accent-soft:rgba(245,184,61,.16);
  --sel:#ff4766;
  --hi:#59c8ff;
  --ok:#5fd38d;
  --radius:12px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.kbd{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);border:1px solid var(--line-strong);
  border-radius:4px;padding:2px 5px;background:rgba(255,255,255,.03)}
.ui-fade{transition:opacity .25s ease, transform .25s ease}
body.zen .zen-hide{opacity:0;pointer-events:none;transform:scale(.98)}

/* ---------- file chip (top left) ---------- */
#fileChip{position:fixed;left:16px;top:14px;padding:8px 12px 8px 10px;display:flex;gap:10px;align-items:center;max-width:46vw}
#fileChip .logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 200deg,#f5b83d,#ff7a59,#59c8ff,#f5b83d);
  display:grid;place-items:center;flex:none}
#fileChip .logo::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--panel-solid)}
#fileChip .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fileChip .meta{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fileChip .save{margin-left:6px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
#fileChip .save i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
#fileChip .save.busy i{background:var(--accent);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- options pill (top center) ---------- */
#opts{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 10px 7px 14px;
  min-height:42px;white-space:nowrap}
#opts .tname{font-weight:600}
#opts .sep{width:1px;height:20px;background:var(--line-strong)}
#opts label{display:flex;align-items:center;gap:8px;color:var(--muted)}
#opts output{color:var(--text);min-width:42px;font-variant-numeric:tabular-nums}
#opts .muted{color:var(--muted)}
.btn{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--accent);color:#1a1405;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
select{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--text);border:0;box-shadow:0 0 0 3px rgba(0,0,0,.35)}

/* ---------- tool rail (left) ---------- */
#rail{position:fixed;left:16px;top:50%;transform:translateY(-50%);padding:6px;display:flex;flex-direction:column;gap:2px}
#rail .tool{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#c9cad1;position:relative}
#rail .tool:hover{background:rgba(255,255,255,.07);color:#fff}
#rail .tool.on{background:var(--accent-soft);color:var(--accent)}
#rail .tool svg{width:20px;height:20px}
#rail .div{height:1px;background:var(--line-strong);margin:5px 6px}
#rail .tip{position:absolute;left:50px;top:50%;transform:translateY(-50%);background:var(--panel-solid);border:1px solid var(--line-strong);
  padding:5px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;display:flex;gap:8px;align-items:center;color:var(--text)}
#rail .tool:hover .tip{opacity:1;transition-delay:.35s}
#rail.collapsed{padding:4px}
#rail.collapsed .tool:not(.collapse),#rail.collapsed .div{display:none}

/* ---------- side panel (right) ---------- */
#side{position:fixed;right:16px;top:14px;width:300px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px)}
body.strip-collapsed #side{max-height:calc(100vh - 70px)}
.card{padding:10px}
.card h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:8px;padding:2px}
.seg button{padding:3px 7px;border-radius:6px;color:var(--muted);font-size:11.5px}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(255,255,255,.1);color:var(--text)}
#mmWrap{position:relative;border-radius:8px;overflow:hidden;cursor:crosshair;
  background:repeating-conic-gradient(#2a2b30 0 25%,#222327 0 50%) 0 0/12px 12px}
#mmCanvas{display:block;width:100%;aspect-ratio:2/1}
#layersCard{display:flex;flex-direction:column;min-height:0;flex:1}
#layers{overflow:auto;margin:0 -4px;padding:0 4px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:rgba(255,255,255,.05)}
.layer.sel{background:rgba(255,255,255,.07);border-color:var(--line-strong)}
.layer .ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none;color:#c9cad1}
.layer .ico svg{width:15px;height:15px}
.layer .nm{flex:1;min-width:0}
.layer .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .nm small{color:var(--muted);font-size:11px}
.layer .eye{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.layer .eye:hover{color:var(--text);background:rgba(255,255,255,.06)}
.layer.hidden-l .nm,.layer.hidden-l .ico{opacity:.4}
.layer .eye svg{width:16px;height:16px}
.layer-extra{display:flex;align-items:center;gap:8px;padding:2px 8px 8px 40px;color:var(--muted)}
.layer-extra input{flex:1}
.banner{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;background:rgba(245,184,61,.08);border:1px solid rgba(245,184,61,.22);margin-bottom:8px;font-size:12px}
.banner span{flex:1;color:#f1d9a6}
.empty{color:var(--faint);font-size:12px;padding:6px 6px 2px}

/* ---------- filmstrip (bottom) ---------- */
#strip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:8px;display:flex;gap:8px;align-items:flex-end;max-width:calc(100vw - 32px)}
#strip .thumb{width:150px;border-radius:8px;padding:4px;border:1px solid transparent;cursor:pointer;flex:none}
#strip .thumb:hover{background:rgba(255,255,255,.05)}
#strip .thumb.on{border-color:var(--accent);background:var(--accent-soft)}
#strip .thumb .img{width:100%;aspect-ratio:2/1;border-radius:5px;background:#222 center/cover no-repeat;position:relative}
#strip .thumb .st{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
#strip .thumb .st.edited{background:var(--accent)}
#strip .thumb .t1{margin-top:5px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .thumb .t2{font-size:10.5px;color:var(--muted)}
#strip .collapse{align-self:stretch;width:22px;border-radius:7px;color:var(--muted);display:grid;place-items:center}
#strip .collapse:hover{background:rgba(255,255,255,.06);color:var(--text)}
#stripTab{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);padding:5px 12px;font-size:11.5px;color:var(--muted);display:none}
body.strip-collapsed #strip{display:none}
body.strip-collapsed #stripTab{display:block}

/* ---------- marking menu ---------- */
#marking{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;display:none;z-index:20}
#marking.open{display:block}
#marking .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,10,12,.35)}
#marking .center{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff}
#marking .item{position:absolute;transform:translate(-50%,-50%);padding:7px 11px;border-radius:9px;white-space:nowrap;display:flex;gap:7px;align-items:center;
  background:var(--panel-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);transition:transform .08s, background .08s}
#marking .item svg{width:15px;height:15px}
#marking .item.on{background:var(--accent);color:#1a1405;transform:translate(-50%,-50%) scale(1.08);border-color:transparent}
#marking svg.line{position:absolute;left:0;top:0;overflow:visible}

/* ---------- palette & modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
.overlay.open{display:block}
#palette .box{position:absolute;left:50%;top:16vh;transform:translateX(-50%);width:min(560px,92vw);padding:8px}
#palette input{width:100%;font:inherit;font-size:15px;color:var(--text);background:transparent;border:0;outline:none;padding:10px 10px 12px;border-bottom:1px solid var(--line)}
#palette ul{list-style:none;margin:6px 0 0;padding:0;max-height:50vh;overflow:auto}
#palette li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
#palette li small{color:var(--muted);margin-left:8px}
#palette li.on{background:rgba(255,255,255,.08)}
#exportDlg .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);padding:18px}
#exportDlg h2{margin:0 0 4px;font-size:16px}
#exportDlg p{margin:0 0 14px;color:var(--muted)}
.preset{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.preset:hover{background:rgba(255,255,255,.04)}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.preset .pn{flex:1}
.preset .pn b{font-weight:600}
.preset .pn small{display:block;color:var(--muted);font-size:11.5px}
.preset .mp{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.preset.dis{opacity:.45;cursor:default}
.warn{display:flex;gap:8px;padding:9px 10px;border-radius:9px;background:rgba(255,71,102,.09);border:1px solid rgba(255,71,102,.3);color:#ffc2cc;margin:10px 0 0;font-size:12px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ---------- misc ---------- */
#toasts{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:25;pointer-events:none}
body.strip-collapsed #toasts{bottom:60px}
.toast{padding:8px 12px;border-radius:9px;background:var(--panel-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#hint{position:fixed;left:16px;bottom:14px;color:var(--faint);font-size:11.5px;display:flex;gap:12px;align-items:center}
#hint b{color:var(--muted);font-weight:500}
#badge{position:fixed;left:50%;top:66px;transform:translateX(-50%);padding:5px 11px;border-radius:20px;font-size:12px;display:none;background:var(--panel-solid);border:1px solid var(--line-strong)}
#badge.show{display:block}
#loading{position:fixed;left:16px;top:72px;font-size:11.5px;color:var(--muted);display:none;align-items:center;gap:7px}
#loading.show{display:flex}
#loading i{width:12px;height:12px;border-radius:50%;border:2px solid var(--faint);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.zenhint{position:fixed;right:16px;bottom:14px;color:var(--faint);font-size:11.5px;display:none}
body.zen .zenhint{display:block}
@media (max-width:1180px){#opts{top:66px}#loading{top:120px}#badge{top:118px}#hint{display:none}#fileChip{max-width:calc(100vw - 360px)}}
.mockflag{position:fixed;right:16px;bottom:14px;font-size:10.5px;color:var(--faint);letter-spacing:.04em}
body.zen .mockflag{display:none}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>

<div id="fileChip" class="glass ui-fade zen-hide">
  <div class="logo"></div>
  <div style="min-width:0">
    <div class="name" id="fName">–</div>
    <div class="meta" id="fMeta">–</div>
  </div>
  <div class="save" id="saveState"><i></i><span>Saved</span></div>
</div>

<div id="opts" class="glass ui-fade zen-hide"></div>

<nav id="rail" class="glass ui-fade zen-hide"></nav>

<aside id="side" class="ui-fade zen-hide">
  <section class="card glass">
    <header>
      <h3>Navigator</h3>
      <div class="seg" id="viewSeg">
        <button data-v="zenith" title="Zenith (3)">Zenith</button>
        <button data-v="horizon" title="Horizon (2)">Horizon</button>
        <button data-v="nadir" title="Nadir (1)">Nadir</button>
      </div>
    </header>
    <div id="mmWrap"><canvas id="mmCanvas" width="560" height="280"></canvas></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <div class="seg" id="projSeg">
        <button data-p="0" class="on" title="Rectilinear">Sphere</button>
        <button data-p="1" title="Little Planet (L)">Planet</button>
        <button data-p="2" title="Flat overview (F)">Flat</button>
      </div>
      <span class="muted" id="viewRead" style="color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums"></span>
    </div>
  </section>
  <section class="card glass" id="layersCard">
    <header><h3>Layers</h3><span class="muted" style="color:var(--faint);font-size:11px">non-destructive</span></header>
    <div id="holeBanner"></div>
    <div id="layers"></div>
  </section>
</aside>

<footer id="strip" class="glass ui-fade zen-hide"></footer>
<button id="stripTab" class="glass zen-hide">▴ Filmstrip</button>

<div id="marking"></div>
<div id="palette" class="overlay"><div class="box glass"><input id="palIn" placeholder="Type a command…" autocomplete="off"><ul id="palList"></ul></div></div>
<div id="exportDlg" class="overlay"><div class="box glass" id="exportBox"></div></div>
<div id="toasts"></div>
<div id="badge"></div>
<div id="loading" class="zen-hide"><i></i><span>Loading full resolution…</span></div>
<div id="hint" class="ui-fade zen-hide">
  <span><b>Right-drag</b> marking menu</span><span><b>Space-drag</b> look</span><span><b>⌘K</b> commands</span><span><b>Tab</b> zen</span><span><b>\</b> before/after</span>
</div>
<div class="zenhint">Zen mode · <span class="kbd">Tab</span> to exit</div>
<div class="mockflag">UX MOCKUP v1 · simulated processing</div>

<script>
"use strict";
/* =========================================================================
   pano-retouch UX mockup v1
   Everything is client-side and simulated. Retouch effects are cheap GPU
   approximations meant to convey interaction, not final quality.
   ========================================================================= */
const D2R=Math.PI/180, R2D=180/Math.PI, MW=2048, MH=1024;
const $=s=>document.querySelector(s);
const TD='../../testdata-local/_mockup/';
const IMAGES=[
  {id:'a',name:'_DSC5395 Panorama 16bit.tif',w:23800,h:11900,bits:16,cs:'ProPhoto RGB',cam:'Sony A7R4 · Sigma 14mm',src:TD+'a-8k.png',lo:TD+'a-2k.png',thumb:TD+'a-thumb.jpg',view:{yaw:0,pitch:-35,fov:95}},
  {id:'b',name:'BC_07864_Pano_41.tif',w:13000,h:6500,bits:16,cs:'sRGB',cam:'Sony A7M2 · Samyang 12mm',src:TD+'b-8k.png',lo:TD+'b-2k.png',thumb:TD+'b-thumb.jpg',view:{yaw:55,pitch:-40,fov:100}},
  {id:'c',name:'IMG_20260106_152304_00_042_B2.jpg',w:11904,h:5952,bits:8,cs:'Display P3',cam:'Insta360 X5',src:TD+'c-8k.jpg',lo:TD+'c-2k.png',thumb:TD+'c-thumb.jpg',view:{yaw:0,pitch:-10,fov:90}},
];

/* ---------------- icons ---------------- */
const I={
  nav:'<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
  brush:'<path d="M4 20c2 0 4-1 4-3.5S6.5 13 9 13l7.5-7.5a2.1 2.1 0 013 3L12 16c0 2.5-3.5 4-8 4z"/>',
  eraser:'<path d="M7 20h11M5 15l8-8a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L11 19H8z"/><path d="M9 11l5 5"/>',
  heal:'<rect x="4" y="9" width="16" height="6" rx="3" transform="rotate(-45 12 12)"/><circle cx="12" cy="12" r=".6"/><circle cx="10.6" cy="12" r=".6"/><circle cx="13.4" cy="12" r=".6"/>',
  clone:'<path d="M9 4h6v4l2 3H7l2-3zM6 11h12v3H6zM8 14v6h8v-6"/>',
  shadow:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  blur:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/><path d="M9 14h.01M12 16h.01M15 14h.01M12 12h.01"/>',
  patch:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M12 16v5"/>',
  fill:'<path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3 3.9M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.6 9.6 0 004.4-1"/>',
  base:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/>',
  zen:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  split:'<path d="M12 3v18M4 6h16v12H4z"/>',chev:'<path d="M15 6l-6 6 6 6"/>',chevr:'<path d="M9 6l6 6-6 6"/>',chevd:'<path d="M6 9l6 6 6-6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
};
const svg=(k,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ---------------- tools ---------------- */
const TOOLS=[
  {id:'nav',key:'V',name:'Navigate',icon:'nav'},
  {div:1},
  {id:'brush',key:'B',name:'Mask Brush',icon:'brush',paint:1},
  {id:'eraser',key:'E',name:'Mask Eraser',icon:'eraser',paint:1},
  {id:'heal',key:'J',name:'Spot Healing',icon:'heal',paint:1},
  {id:'clone',key:'S',name:'Clone Stamp',icon:'clone',paint:1},
  {id:'shadow',key:'O',name:'Shadow Lighten',icon:'shadow',paint:1},
  {id:'blur',key:'R',name:'Blur (privacy)',icon:'blur',paint:1},
  {div:1},
  {id:'patch',key:'N',name:'Nadir Patch',icon:'patch'},
];
const tool={id:'brush',size:4,hard:.5};

/* ---------------- GL ---------------- */
const cv=$('#gl'); const gl=cv.getContext('webgl2',{antialias:false,premultipliedAlpha:false});
if(!gl){document.body.innerHTML='<p style="padding:40px">WebGL2 not available.</p>';throw 0}
const aniso=gl.getExtension('EXT_texture_filter_anisotropic');
const VS=`#version 300 es
in vec2 p; void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es

];
let palSel=0,palItems=[];
function openPalette(){$('#palette').classList.add('open');$('#palIn').value='';renderPal();setTimeout(()=>$('#palIn').focus(),0)}
function closePalette(){$('#palette').classList.remove('open');cv.focus()}
function renderPal(){const q=$('#palIn').value.toLowerCase().trim();palItems=CMDS().filter(c=>!q||q.split(/\s+/).every(w=>c.label.toLowerCase().includes(w)));palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $('#palList').innerHTML=palItems.map((c,i)=>`<li class="${i===palSel?'on':''}" data-i="${i}"><span>${c.label}</span>${c.key?`<span class="kbd">${c.key}</span>`:''}</li>`).join('')||'<li style="color:var(--muted)">No commands</li>';
  $('#palList').querySelectorAll('[data-i]').forEach(li=>li.onclick=()=>{closePalette();palItems[+li.dataset.i].run()})}
$('#palIn').oninput=()=>{palSel=0;renderPal()};
$('#palIn').onkeydown=e=>{if(e.key==='ArrowDown'){palSel=Math.min(palItems.length-1,palSel+1);renderPal();e.preventDefault()}else if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);renderPal();e.preventDefault()}
  else if(e.key==='Enter'){const c=palItems[palSel];closePalette();c&&c.run()}else if(e.key==='Escape')closePalette();e.stopPropagation()};
$('#palette').onpointerdown=e=>{if(e.target.id==='palette')closePalette()};

/* ---------------- export dialog ---------------- */
let expSel=0;
function openExport(){const im=cur,s=ST();const ext=im.name.split('.').pop().toUpperCase();
  const P=[{n:'Full resolution',d:`${ext} · ${im.cs} · keeps metadata`,w:im.w},{n:'Street View',d:'JPEG · sRGB · ≤ 75 MB (to verify)',w:13000},{n:'16K',d:`${ext} · ${im.cs}`,w:16384},{n:'24K',d:`${ext} · ${im.cs}`,w:24576},{n:'32K',d:`${ext} · ${im.cs}`,w:32768}];
  const holes=s.holeCount>0&&!s.layers.some(l=>l.type==='fill'&&l.visible&&l.name==='Fill Holes');
  function draw(){const p=P[expSel];const jpeg=expSel===1||ext==='JPG';
    $('#exportBox').innerHTML=`<h2>Export</h2><p>To <b style="color:var(--text)">export/</b> · suffix <b style="color:var(--text)">_retouched</b> · original stays untouched</p>`+
    P.map((p,i)=>{const up=p.w>im.w;return`<div class="preset ${i===expSel?'on':''} ${up?'dis':''}" data-p="${i}"><div class="pn"><b>${p.n}</b><small>${p.w} × ${p.w/2} px · ${p.d}${up?' · exceeds source':''}</small></div><span class="mp">${Math.round(p.w*p.w/2/1e6)} MP</span></div>`}).join('')+
    (holes&&jpeg?`<div class="warn">⚠ This image contains unfilled transparent areas. JPEG has no transparency – they will be filled with <b>black</b> (configurable).</div>`:'')+
    `<div class="row"><button class="btn" id="exCancel">Cancel</button><button class="btn primary" id="exGo">Export</button></div>`;
    $('#exportBox').querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{if(P[+e.dataset.p].w>im.w)return;expSel=+e.dataset.p;draw()});
    $('#exCancel').onclick=()=>$('#exportDlg').classList.remove('open');
    $('#exGo').onclick=()=>{$('#exportDlg').classList.remove('open');setBusy('Exporting…');setTimeout(()=>{setBusy(null);toast(`Exported ${P[expSel].n} → export/${im.name.replace(/\.(\w+)$/,'_retouched.'+(expSel===1?'jpg':'$1'))} (mockup)`)},900)}}
  if(P[expSel].w>im.w)expSel=0;draw();$('#exportDlg').classList.add('open')}
$('#exportDlg').onpointerdown=e=>{if(e.target.id==='exportDlg')$('#exportDlg').classList.remove('open')};

/* ---------------- misc UI helpers ---------------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.innerHTML=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2200)}
let badgeT;function badge(t){const b=$('#badge');b.textContent=t;b.classList.add('show');clearTimeout(badgeT);badgeT=setTimeout(()=>{if(!showOrig)b.classList.remove('show')},900)}
let saveT;function saveTick(){const e=$('#saveState');e.classList.add('busy');e.lastChild.textContent='Saving…';clearTimeout(saveT);saveT=setTimeout(()=>{e.classList.remove('busy');e.lastChild.textContent='Saved'},500)}
function setBusy(t){const e=$('#loading');if(t){e.lastChild.textContent=t;e.classList.add('show')}else e.classList.remove('show')}
function toggleZen(){document.body.classList.toggle('zen');badge(document.body.classList.contains('zen')?'Zen mode':'Panels visible')}
let dirty=true;function markDirty(){dirty=true}
let showOrig=false;

/* ---------------- input ---------------- */
let space=false,drag=null,mouse={x:-1,y:-1,in:false},vel={yaw:0,pitch:0},lastMove=0;
function updateCursor(){const paintable=TOOLS.find(t=>t.id===tool.id).paint&&cam.mode!==2;cv.style.cursor=space||drag&&drag.kind==='look'?'grabbing':tool.id==='nav'?'grab':paintable?'none':tool.id==='patch'?'ew-resize':'default'}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.focus();if(mk&&mk.sticky){closeMarking(true);return}
  if(e.button===2){openMarking(e.clientX,e.clientY);cv.setPointerCapture(e.pointerId);return}
  const look=e.button===1||(e.button===0&&(tool.id==='nav'||space||cam.mode===2&&tool.id!=='patch'));
  anim=null;vel={yaw:0,pitch:0};
  if(look&&cam.mode!==2){drag={kind:'look',x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);updateCursor();return}
  if(e.button!==0)return;
  if(tool.id==='patch'){const L=ensurePatch();drag={kind:'patch',x:e.clientX,start:L.params.rot,before:{...L.params},L};cv.setPointerCapture(e.pointerId);return}
  if(TOOLS.find(t=>t.id===tool.id).paint&&cam.mode!==2){const d=screenToDir(e.clientX,e.clientY);if(!d)return;beginStroke(d,e);if(stroke){drag={kind:'paint'};cv.setPointerCapture(e.pointerId)}}});
cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;
  if(mk){moveMarking(e.clientX,e.clientY);return}
  if(!drag)return;
  if(drag.kind==='look'){const k=(cam.mode===1?Math.min(cam.fov,180):cam.fov)/CH;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    const now=performance.now(),dt=Math.max(1,now-lastMove);lastMove=now;
    const dyaw=-dx*k*(cam.mode===1&&cam.pitch<-60?-1:1),dp=dy*k;cam.yaw+=dyaw;cam.pitch=Math.max(-90,Math.min(90,cam.pitch+dp));vel={yaw:dyaw/dt*16,pitch:dp/dt*16}}
  else if(drag.kind==='patch'){let r=drag.start+(e.clientX-drag.x)*.4;if(e.shiftKey)r=Math.round(r/15)*15;r=((r+180)%360+360)%360-180;drag.L.params.rot=r;
    if(e.shiftKey)badge('Snapped '+Math.round(r)+'°');const o=$('#oRot');if(o){o.value=r;$('#oRoto').textContent=Math.round(r)+'°'}}
  else if(drag.kind==='paint'&&stroke){const d=screenToDir(e.clientX,e.clientY);if(d)moveStroke(d)}});
cv.addEventListener('pointerup',e=>{
  if(mk){const quick=performance.now()-mk.t0<220&&!mk.moved;if(quick){mk.sticky=true;return}closeMarking(true);return}
  if(!drag)return;const k=drag.kind;
  if(k==='paint')endStroke();
  if(k==='patch'){const L=drag.L,b=drag.before,a={...L.params};if(a.rot!==b.rot)pushUndo({undo(){Object.assign(L.params,b);renderOpts()},redo(){Object.assign(L.params,a);renderOpts()}});renderLayers()}
  if(k==='look'&&e.shiftKey&&Math.abs(cam.pitch)<6){animTo({pitch:0},250);badge('Snapped to horizon')}
  if(k==='look'&&performance.now()-lastMove>60)vel={yaw:0,pitch:0};
  drag=null;updateCursor()});
cv.addEventListener('pointerleave',()=>{mouse.in=false});
cv.addEventListener('dblclick',e=>{if(cam.mode===2){const d=screenToDir(e.clientX,e.clientY);if(!d)return;const[lo,la]=dir2ll(d);cam.mode=0;setMode(0);cam.fov=80;animTo({yaw:lo*R2D,pitch:la*R2D},500);document.querySelectorAll('#projSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.p===0));renderOpts()}});
cv.addEventListener('wheel',e=>{e.preventDefault();
  if(e.altKey){if(tool.id==='patch'){const L=ensurePatch();L.params.radius=Math.max(2,Math.min(45,L.params.radius*Math.exp(-e.deltaY*.002)));renderOpts();renderLayers()}else{tool.size=Math.max(.2,Math.min(40,tool.size*Math.exp(-e.deltaY*.002)));renderOpts()}return}
  if(cam.mode===2)return;anim=null;cam.fov=Math.max(12,Math.min(fovMax(),cam.fov*Math.exp(e.deltaY*.0012)))},{passive:false});
window.addEventListener('keydown',e=>{if($('#palette').classList.contains('open')||e.target.tagName==='INPUT'&&e.target.type!=='range'||e.target.tagName==='SELECT')return;
  const mod=e.metaKey||e.ctrlKey,k=e.key;
  if(mod&&k.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(mod&&k.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k.toLowerCase()==='e'){e.preventDefault();openExport();return}
  if(mod)return;
  if(k===' '){e.preventDefault();if(!space){space=true;updateCursor()}return}
  if(k==='Tab'){e.preventDefault();toggleZen();return}
  if(k==='Escape'){closeMarking(false);$('#exportDlg').classList.remove('open');return}
  if(k==='\\'){if(!showOrig)toggleOriginal(true);return}
  if(k==='['||k===']'||e.code==='BracketLeft'||e.code==='BracketRight'){const f=(k===']'||e.code==='BracketRight')?1.15:1/1.15;if(tool.id==='patch'){const L=ensurePatch();L.params.radius=Math.max(2,Math.min(45,L.params.radius*f));renderLayers()}else tool.size=Math.max(.2,Math.min(40,tool.size*f));renderOpts();return}
  if(k==='Enter'){fillSelection();return}
  if(k==='Backspace'||k==='Delete'){clearSelection();return}
  if(k==='1')return goView('nadir');if(k==='2')return goView('horizon');if(k==='3')return goView('zenith');
  if(k==='l'||k==='L')return setMode(cam.mode===1?0:1);if(k==='f'||k==='F')return setMode(cam.mode===2?0:2);
  const t=TOOLS.find(t=>t.key&&t.key.toLowerCase()===k.toLowerCase());if(t)setTool(t.id)});
window.addEventListener('keyup',e=>{if(e.key===' '){space=false;updateCursor()}if(e.key==='\\')toggleOriginal(false)});
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>goView(b.dataset.v));
document.querySelectorAll('#projSeg button').forEach(b=>b.onclick=()=>setMode(+b.dataset.p));

/* ---------------- render loop ---------------- */
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR;cv.height=CH*DPR;
  const r=mm.getBoundingClientRect();mm.width=Math.round(r.width*DPR);mm.height=Math.round(r.width/2*DPR)}
window.addEventListener('resize',resize);
let frameN=0;
function frame(now){requestAnimationFrame(frame);stepAnim(now);
  if(!drag&&!anim&&(Math.abs(vel.yaw)>.01||Math.abs(vel.pitch)>.01)){cam.yaw+=vel.yaw;cam.pitch=Math.max(-90,Math.min(90,cam.pitch+vel.pitch));vel.yaw*=.92;vel.pitch*=.92}
  if(cam.mode===0)cam.pitch=Math.max(-89.99,Math.min(89.99,cam.pitch));
  cam.fov=Math.min(cam.fov,fovMax());
  if(stroke)flushStroke();
  gl.viewport(0,0,cv.width,cv.height);const{f,r,u}=basis();
  gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform3fv(U.uF,f);gl.uniform3fv(U.uR,r);gl.uniform3fv(U.uU,u);gl.uniform1f(U.uFov,cam.fov*D2R);gl.uniform1i(U.uMode,cam.mode);
  const fr=flatRect();gl.uniform4f(U.uFlat,fr.x*DPR,(CH-fr.y-fr.h)*DPR,fr.w*DPR,fr.h*DPR);
  const paint=TOOLS.find(t=>t.id===tool.id).paint&&cam.mode!==2&&mouse.in&&!mk&&!(drag&&drag.kind==='look')&&!space;
  const cd=mouse.in?screenToDir(mouse.x,mouse.y):null;
  gl.uniform3fv(U.uCur,cd||[0,1,0]);gl.uniform1f(U.uCurR,tool.size*D2R);gl.uniform1f(U.uCurOn,paint&&cd?1:0);
  const s=cur&&ST();let c2on=0,c2=[0,1,0];
  if(s&&tool.id==='clone'&&s.cloneSrc&&paint){if(s.cloneSrc.layer&&s.cloneSrc.layer.M&&cd){c2=mulM(s.cloneSrc.layer.M,cd)}else c2=s.cloneSrc.dir;c2on=1}
  gl.uniform3fv(U.uCur2,c2);gl.uniform1f(U.uCur2On,c2on);
  gl.uniform1f(U.uOrig,showOrig?1:0);gl.uniform1f(U.uHiOn,hoverLayer?1:0);gl.uniform1f(U.uTime,now/1000);
  gl.uniform1f(U.uShadowGain,shadowGain);gl.uniform1f(U.uBlurLod,blurLod);
  if(patchLayer){const p=patchLayer.params;gl.uniform4f(U.uPatch,1,p.radius*D2R,p.rot*D2R,patchLayer.opacity);gl.uniform1i(U.uPatchMode,p.mode)}else gl.uniform4f(U.uPatch,0,.1,0,0);
  const ids=[0,0,0];cloneSlots.forEach((L,i)=>{ids[i]=1;gl.uniformMatrix3fv(U['uM'+i],false,colMajor(L.M))});gl.uniform3fv(U.uCOn,ids);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if((frameN++&1)===0){drawMM();
    $('#viewRead').textContent=cam.mode===2?'Flat overview':`${(((cam.yaw%360)+540)%360-180).toFixed(0)}° / ${cam.pitch.toFixed(0)}° · FOV ${cam.fov.toFixed(0)}°`}}

/* ---------------- boot ---------------- */
resize();renderRail();loadImage(IMAGES[0]).then(()=>{resize()});requestAnimationFrame(frame);
setTimeout(()=>toast('Tip: right-drag anywhere for the marking menu'),1200);
</script>
</body>
