<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pano-retouch – UX Mockup v2</title>
<style>
:root{
  --bg:#0e0f11;
  --panel:rgba(24,25,29,.88);
  --panel-solid:#1a1b1f;
  --panel-2:#212227;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.14);
  --text:#e9e9ec;
  --muted:#8d8f98;
  --faint:#5d5f68;
  /* domain colours (Maya-style): every tool/action belongs to one domain */
  --d-view:#59c8ff;
  --d-mask:#ff5c8a;
  --d-retouch:#f5b83d;
  --d-nadir:#5fd38d;
  --radius:12px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.ui-fade{transition:opacity .2s ease, transform .2s ease}
body.zen .zen-hide{opacity:0;pointer-events:none;transform:scale(.985)}
.muted{color:var(--muted)}

/* keycaps */
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:5px;
  background:linear-gradient(#36373d,#2a2b30);border:1px solid rgba(255,255,255,.13);border-bottom-width:2px;
  font:600 10.5px/1 -apple-system,system-ui,sans-serif;color:#dcdde3;vertical-align:middle;margin:0 1px}
.kc-or{color:var(--faint);margin:0 3px;font-size:11px}

/* generic buttons */
.btn{height:30px;padding:0 11px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:#e9e9ec;color:#141518;border-color:transparent;font-weight:600}
.btn.primary:hover{background:#fff}
.btn.primary .kc{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.18);color:#26272c}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#c9cad1}
.ibtn:hover{background:rgba(255,255,255,.08);color:#fff}
.ibtn.on{background:rgba(255,255,255,.12);color:#fff}
.ibtn svg{width:18px;height:18px}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.vsep{width:1px;height:22px;background:var(--line-strong);flex:none}

/* ---------- header (top left) ---------- */
#header{position:fixed;left:16px;top:14px;height:48px;padding:0 6px 0 6px;display:flex;gap:6px;align-items:center;max-width:calc(100vw - 360px)}
#appBtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
#appBtn:hover{background:rgba(255,255,255,.08)}
#appBtn .logo{width:24px;height:24px;border-radius:7px;background:conic-gradient(from 200deg,#f5b83d,#ff5c8a,#59c8ff,#5fd38d,#f5b83d);display:grid;place-items:center}
#appBtn .logo::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--panel-solid)}
#titleBlock{min-width:0;display:flex;flex-direction:column;gap:3px;padding-right:6px}
#fName{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.chips{display:flex;gap:4px}
.chip{font-size:10.5px;line-height:16px;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.07);color:#b9bac2;white-space:nowrap;font-variant-numeric:tabular-nums}
#saveState{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap}
#saveState i{width:7px;height:7px;border-radius:50%;background:var(--d-nadir)}
#saveState.busy i{background:var(--d-retouch);animation:pulse .7s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- tool options bar (top center) ---------- */
#opts{position:fixed;left:50%;top:14px;transform:translateX(-50%);height:48px;display:flex;align-items:center;gap:10px;padding:0 8px;white-space:nowrap}
#toolChip{height:32px;display:flex;align-items:center;gap:7px;padding:0 10px 0 7px;border-radius:8px;font-weight:600;
  background:color-mix(in srgb,var(--dc) 16%,transparent);color:var(--dc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 35%,transparent)}
#toolChip svg{width:18px;height:18px}
#toolChip .nm{color:var(--text)}
#toolChip.flash{animation:flash .45s ease}
@keyframes flash{0%{box-shadow:inset 0 0 0 1px var(--dc),0 0 0 6px color-mix(in srgb,var(--dc) 35%,transparent)}100%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 35%,transparent),0 0 0 0 transparent}}
.hintline{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
/* scrub fields (Figma/Blender style): drag the label, click to type, double-click label to reset */
.field{height:30px;display:flex;align-items:center;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative;overflow:hidden}
.field:hover{border-color:var(--line-strong)}
.field .lbl{padding:0 6px 0 9px;color:var(--muted);cursor:ew-resize;height:100%;display:flex;align-items:center;font-size:12px}
.field .lbl:hover{color:var(--text)}
.field input{width:44px;background:none;border:0;outline:none;color:var(--text);font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0}
.field .unit{color:var(--muted);padding:0 8px 0 2px;font-size:12px}
.field .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--dc,#e9e9ec);opacity:.7;pointer-events:none}
.field input:focus{color:#fff}
.field.focus{border-color:rgba(255,255,255,.35)}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.05);border-radius:8px;padding:2px;border:1px solid var(--line)}
.seg button{height:24px;padding:0 8px;border-radius:6px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.seg button svg{width:15px;height:15px}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(255,255,255,.12);color:var(--text)}

/* ---------- tool rail (left) ---------- */
#rail{position:fixed;left:16px;top:50%;transform:translateY(-50%);padding:6px;display:flex;flex-direction:column;gap:2px}
#rail .tool{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#c9cad1}
#rail .tool:hover{background:rgba(255,255,255,.07);color:#fff}
#rail .tool.on{background:color-mix(in srgb,var(--dc) 18%,transparent);color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 40%,transparent)}
#rail .tool svg{width:21px;height:21px}
#rail .div{height:1px;background:var(--line-strong);margin:5px 6px}
#rail.collapsed .tool:not(.collapse),#rail.collapsed .div{display:none}

/* ---------- side panel (right) ---------- */
#side{position:fixed;right:16px;top:14px;width:304px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 128px)}
body.strip-collapsed #side{max-height:calc(100vh - 60px)}
.card{padding:10px}
.card h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;height:30px}
.card header .grp{display:flex;gap:2px;align-items:center}
#mmWrap{position:relative;border-radius:8px;overflow:hidden;cursor:crosshair;background:repeating-conic-gradient(#2a2b30 0 25%,#222327 0 50%) 0 0/12px 12px}
#mmCanvas{display:block;width:100%;aspect-ratio:2/1}
#navFoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
#navFoot .field{height:28px}
#navFoot .field input{width:27px;font-size:12px}
#navFoot .field .lbl{padding:0 2px 0 6px;font-size:11px}
#navFoot .field .unit{padding:0 5px 0 0}
#navFoot .seg button{padding:0 5px;height:22px}
#navFields{display:flex;gap:3px}
#layersCard{display:flex;flex-direction:column;min-height:0;flex:1}
.tabs{display:flex;gap:14px}
.tabs button{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);height:30px}
.tabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
#layerList,#historyList{overflow:auto;margin:0 -4px;padding:0 4px;min-height:40px}
.layer{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px;border-radius:8px;cursor:pointer;border:1px solid transparent;position:relative}
.layer:hover{background:rgba(255,255,255,.05)}
.layer.sel{background:rgba(255,255,255,.08);border-color:var(--line-strong)}
.layer .ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none;color:#c9cad1}
.layer .ico svg{width:17px;height:17px}
.layer .nm{flex:1;min-width:0}
.layer .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .nm small{color:var(--muted);font-size:11px;white-space:nowrap}
.layer .nm input{width:100%;font:inherit;font-weight:500;color:var(--text);background:#0e0f11;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:2px 5px;outline:none}
.layer .act{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none}
.layer .act:hover{color:var(--text);background:rgba(255,255,255,.08)}
.layer .act svg{width:16px;height:16px}
.layer .act.hov{opacity:0}
.layer:hover .act.hov,.layer.sel .act.hov{opacity:1}
.layer.hidden-l .nm,.layer.hidden-l .ico{opacity:.4}
.layer.group .ico{background:none}
.layer.group .caret{width:16px;color:var(--muted);display:grid;place-items:center;margin-right:-4px}
.layer.group .caret svg{width:14px;height:14px;transition:transform .15s}
.layer.group.closed .caret svg{transform:rotate(-90deg)}
.layer.child{margin-left:18px}
.layer.drop-before{box-shadow:0 -2px 0 0 var(--text)}
.layer.drop-after{box-shadow:0 2px 0 0 var(--text)}
.layer.drop-into{border-color:var(--text);background:rgba(255,255,255,.08)}
.layer.base{cursor:default}
.layer-extra{display:flex;align-items:center;gap:6px;padding:4px 6px 8px 42px}
.layer-extra .field{flex:1}
.layer-extra .field input{width:40px}
.banner{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;background:rgba(95,211,141,.08);border:1px solid rgba(95,211,141,.25);margin-bottom:8px;font-size:12px}
.banner span{flex:1;color:#c7efd6}
.banner svg{flex:none}
.empty{color:var(--faint);font-size:12px;padding:6px 6px 10px;line-height:1.5}
.hist{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:7px;cursor:pointer;color:var(--text)}
.hist:hover{background:rgba(255,255,255,.05)}
.hist.cur{background:rgba(255,255,255,.09)}
.hist.future{color:var(--faint)}
.hist .hi{width:18px;height:18px;flex:none}
.hist .hi svg{width:16px;height:16px}

/* ---------- filmstrip (bottom) ---------- */
#strip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:7px;display:flex;gap:6px;align-items:center;max-width:calc(100vw - 32px)}
#strip .thumb{width:148px;height:100px;border-radius:9px;padding:4px;border:1px solid transparent;cursor:pointer;flex:none;display:flex;flex-direction:column}
#strip .thumb:hover{background:rgba(255,255,255,.05)}
#strip .thumb.on{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.07)}
#strip .thumb .img{width:100%;height:70px;border-radius:6px;background:#222 center/cover no-repeat;position:relative;flex:none}
#strip .thumb .st{position:absolute;right:5px;top:5px;height:16px;padding:0 6px;border-radius:8px;background:rgba(14,15,17,.75);font-size:10px;line-height:16px;color:#fff;display:flex;align-items:center;gap:4px}
#strip .thumb .st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--d-retouch)}
#strip .thumb .t1{margin-top:6px;font-size:11.5px;line-height:14px;height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .collapse{align-self:stretch;width:22px;border-radius:7px;color:var(--muted);display:grid;place-items:center}
#strip .collapse:hover{background:rgba(255,255,255,.06);color:var(--text)}
#strip .collapse svg{width:16px;height:16px}
#stripTab{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);height:28px;padding:0 12px;font-size:11.5px;color:var(--muted);display:none;align-items:center;gap:6px}
body.strip-collapsed #strip{display:none}
body.strip-collapsed:not(.zen) #stripTab{display:flex}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;
  box-shadow:var(--shadow);font-size:12px;opacity:0;transition:opacity .12s;max-width:300px;display:flex;align-items:center;gap:8px}
#tip.show{opacity:1}
#tip.rich{display:block;padding:10px 12px}
.meta-t{font-weight:600;margin-bottom:6px;word-break:break-all}
.meta-g{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px}
.meta-g span:nth-child(odd){color:var(--muted)}

/* ---------- menus / popovers ---------- */
.menu{position:fixed;z-index:40;min-width:220px;padding:5px;display:none}
.menu.open{display:block}
.menu .mi{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:rgba(255,255,255,.08)}
.menu .mi .l{flex:1}
.menu .mi svg{width:16px;height:16px;color:var(--muted)}
.menu .mi.danger{color:#ff8fa5}
.menu .mh{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 9px 4px}
.menu .ms{height:1px;background:var(--line);margin:4px 2px}
#toolPop{position:fixed;z-index:35;padding:12px;display:none;width:300px}
#toolPop.open{display:block}
#toolPop h4{margin:0 0 10px;font-size:12px;display:flex;align-items:center;gap:7px}
#toolPop .prow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#toolPop .prow>span{width:78px;color:var(--muted);font-size:12px}
#toolPop .field{flex:1}
input[type=color]{width:34px;height:28px;border:1px solid var(--line-strong);border-radius:7px;background:none;padding:2px;cursor:pointer}

/* ---------- marking menu ---------- */
#marking{position:fixed;left:0;top:0;width:0;height:0;display:none;z-index:45}
#marking.open{display:block}
#marking .ring{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,10,12,.35);pointer-events:none}
#marking .center{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none}
#marking .item{position:absolute;display:flex;align-items:stretch;border-radius:9px;background:var(--panel-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  white-space:nowrap;transition:transform .08s;height:34px}
#marking .item .main{display:flex;gap:8px;align-items:center;padding:0 11px}
#marking .item svg{width:17px;height:17px}
#marking .item .box{width:26px;display:grid;place-items:center;border-left:1px solid var(--line-strong)}
#marking .item .box i{width:9px;height:9px;border:1.5px solid var(--muted);border-radius:2px}
#marking .item.on{background:#2c2d33;border-color:color-mix(in srgb,var(--dc) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 25%,transparent),var(--shadow)}
#marking .item.on.boxon .box{background:color-mix(in srgb,var(--dc) 30%,transparent)}
#marking .item.on.boxon .box i{border-color:#fff}
#marking .list{position:absolute;top:150px;transform:translateX(-50%);padding:4px;min-width:200px}
#marking .li{display:flex;align-items:center;gap:8px;height:28px;padding:0 9px;border-radius:7px;white-space:nowrap}
#marking .li svg{width:15px;height:15px}
#marking .li .l{flex:1}
#marking .li.on{background:rgba(255,255,255,.1)}
#marking .lh{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 9px 3px}
#marking svg.line{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:48}
.overlay.open{display:block}
#palette .box{position:absolute;left:50%;top:16vh;transform:translateX(-50%);width:min(560px,92vw);padding:8px}
#palette input{width:100%;font:inherit;font-size:15px;color:var(--text);background:transparent;border:0;outline:none;padding:10px 10px 12px;border-bottom:1px solid var(--line)}
#palette ul{list-style:none;margin:6px 0 0;padding:0;max-height:50vh;overflow:auto}
#palette li{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;gap:10px}
#palette li .pl{display:flex;align-items:center;gap:9px}
#palette li .pl svg{width:16px;height:16px}
#palette li.on{background:rgba(255,255,255,.08)}
#exportDlg .box,#keysDlg .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,92vw);padding:18px;max-height:86vh;overflow:auto}
#keysDlg .box{width:min(760px,94vw)}
.dlg h2{margin:0 0 4px;font-size:16px}
.dlg p{margin:0 0 14px;color:var(--muted)}
.preset{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.preset:hover{background:rgba(255,255,255,.04)}
.preset.on{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.06)}
.preset .pn{flex:1}.preset .pn b{font-weight:600}.preset .pn small{display:block;color:var(--muted);font-size:11.5px}
.preset .mp{font-variant-numeric:tabular-nums;font-weight:600}
.preset.dis{opacity:.45;cursor:default}
.warn{display:flex;gap:8px;padding:9px 10px;border-radius:9px;background:rgba(255,92,138,.09);border:1px solid rgba(255,92,138,.3);color:#ffc2d1;margin:10px 0 0;font-size:12px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.keys h5{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.keys h5 i{width:8px;height:8px;border-radius:50%}
.keys .k{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line)}
.keys .k span:first-child{color:#c9cad1}

/* ---------- misc ---------- */
#toasts{position:fixed;left:50%;bottom:136px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:46;pointer-events:none}
body.strip-collapsed #toasts,body.zen #toasts{bottom:64px}
.toast{padding:8px 12px;border-radius:9px;background:var(--panel-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);animation:tin .2s ease;display:flex;align-items:center;gap:6px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#badge{position:fixed;left:50%;top:72px;transform:translateX(-50%);padding:5px 11px;border-radius:20px;font-size:12px;display:none;background:var(--panel-solid);border:1px solid var(--line-strong);z-index:30}
#badge.show{display:block}
#busy{position:fixed;left:16px;top:72px;font-size:11.5px;color:var(--muted);display:none;align-items:center;gap:7px}
#busy.show{display:flex}
#busy i{width:12px;height:12px;border-radius:50%;border:2px solid var(--faint);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#zenPill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:0 12px;height:34px;display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted);z-index:20}
body.zen #zenPill{display:flex}
.mockflag{position:fixed;right:16px;bottom:10px;font-size:10px;color:var(--faint);letter-spacing:.04em;pointer-events:none}
body.zen .mockflag{display:none}
@media (max-width:1280px){#opts{top:70px}#busy{top:126px}#badge{top:126px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>

<div id="header" class="glass ui-fade zen-hide">
  <button id="appBtn" data-tip="Menu"><div class="logo"></div></button>
  <div id="titleBlock"><div id="fName">–</div><div class="chips" id="fChips"></div></div>
  <span class="vsep"></span>
  <button class="ibtn" id="hUndo"></button>
  <button class="ibtn" id="hRedo"></button>
  <button class="ibtn" id="hBA"></button>

/* ---------------- math ---------------- */
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

const dir2ll=d=>[Math.atan2(d[0],-d[2]),Math.asin(Math.max(-1,Math.min(1,d[1])))];
const ll2dir=(lon,lat)=>[Math.cos(lat)*Math.sin(lon),Math.sin(lat),-Math.cos(lat)*Math.cos(lon)];

  return[t*x*x+c,t*x*y-s*z,t*x*z+s*y,t*x*y+s*z,t*y*y+c,t*y*z-s*x,t*x*z-s*y,t*y*z+s*x,t*z*z+c]}
const mulM=(m,d)=>[m[0]*d[0]+m[1]*d[1]+m[2]*d[2],m[3]*d[0]+m[4]*d[1]+m[5]*d[2],m[6]*d[0]+m[7]*d[1]+m[8]*d[2]];
const colMajor=m=>[m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]];
const wrap180=v=>((v%360)+540)%360-180;

/* ---------------- camera ---------------- */
const cam={yaw:0,pitch:-20,fov:90,mode:0};
function basis(){const y=cam.yaw*D2R,p=cam.pitch*D2R;const f=[Math.sin(y)*Math.cos(p),Math.sin(p),-Math.cos(y)*Math.cos(p)];const r=[Math.cos(y),0,Math.sin(y)];return{f,r,u:cross(r,f)}}
let CW=1,CH=1,DPR=1;
function flatRect(){const w=Math.min(CW-120,(CH-120)*2),h=w/2;return{x:(CW-w)/2,y:(CH-h)/2,w,h}}
function screenToDir(px,py){
  if(cam.mode===2){const r=flatRect();const u=(px-r.x)/r.w,v=(py-r.y)/r.h;if(u<0||u>1||v<0||v>1)return null;return ll2dir((u-.5)*2*Math.PI,(.5-v)*Math.PI)}
  const{f,r,u}=basis();const sx=px/CW*2-1,sy=1-py/CH*2,asp=CW/CH;let c;
  if(cam.mode===1){const k=2*Math.tan(cam.fov*D2R/4);const P=[sx*asp*k,sy*k],s=P[0]*P[0]+P[1]*P[1];c=[4*P[0]/(4+s),4*P[1]/(4+s),(4-s)/(4+s)]}

  return norm([r[0]*c[0]+u[0]*c[1]+f[0]*c[2],r[1]*c[0]+u[1]*c[1]+f[1]*c[2],r[2]*c[0]+u[2]*c[1]+f[2]*c[2]])}
let anim=null;
function animTo(t,dur=650,done){anim={from:{...cam},to:t,t0:performance.now(),dur,done}}

  if(t.yaw!==undefined)cam.yaw=f.yaw+wrap180(t.yaw-f.yaw)*e;if(t.pitch!==undefined)cam.pitch=f.pitch+(t.pitch-f.pitch)*e;if(t.fov!==undefined)cam.fov=f.fov+(t.fov-f.fov)*e;

const fovMax=()=>cam.mode===1?320:120;
function goView(v){if(cam.mode===2)setMode(0);
  const P={nadir:{pitch:-90,fov:Math.max(cam.fov,95)},zenith:{pitch:90,fov:Math.max(cam.fov,95)},horizon:{pitch:0}};
  if(P[v]){animTo(P[v]);badge(v[0].toUpperCase()+v.slice(1))}}
function goSaved(i){const v=VIEWS[i];if(!v)return;if(cam.mode!==0){cam.mode=0;cam.fov=Math.min(cam.fov,110);renderNav();renderOpts()}animTo({yaw:v.yaw,pitch:v.pitch,fov:v.fov});badge(v.name)}

  if(m===1){cam.mode=1;animTo({pitch:-90,fov:250},800)}

/* ---------------- stamping on the sphere ---------------- */
function stamp(arrs,c,rad,hard,erase){

  const j0=Math.max(0,Math.floor((.5-(latC+rad)/Math.PI)*MH)),j1=Math.min(MH-1,Math.ceil((.5-(latC-rad)/Math.PI)*MH));
  for(let j=j0;j<=j1;j++){const lat=(.5-(j+.5)/MH)*Math.PI,sl=Math.sin(lat),cl=Math.cos(lat);
    let span;const den=cl*cosC;if(den<1e-6)span=Math.PI;else{const q=(cosR-sl*sinC)/den;if(q>1)continue;span=q<-1?Math.PI:Math.acos(q)}
    const full=span>=Math.PI;const a0=full?0:Math.floor(((lonC-span)/(2*Math.PI)+.5)*MW-1),a1=full?MW-1:Math.ceil(((lonC+span)/(2*Math.PI)+.5)*MW+1);
    for(let ii=a0;ii<=a1;ii++){const i=((ii%MW)+MW)%MW;const lon=((i+.5)/MW-.5)*2*Math.PI;
      const cd=sl*sinC+cl*cosC*Math.cos(lon-lonC);if(cd<cosR)continue;const t=Math.acos(Math.min(1,cd))/rad;
      let v=hard>=.99?1:t<=hard?1:1-(t-hard)/(1-hard);v=v*v*(3-2*v);const val=v*255,idx=j*MW+i;
      for(const a of arrs){if(erase)a[idx]=a[idx]*(1-v);else if(val>a[idx])a[idx]=val}}}}

/* ---------------- layers ---------------- */
const LT={fill:{icon:'fill',label:'Generative Fill',dom:'retouch',sub:'simulated inpainting'},heal:{icon:'heal',label:'Spot Healing',dom:'retouch',sub:'healing strokes'},
  clone:{icon:'clone',label:'Clone',dom:'retouch',sub:'aligned source'},shadow:{icon:'shadow',label:'Shadow Lighten',dom:'retouch',sub:'adjustment'},
  blur:{icon:'blur',label:'Blur',dom:'retouch',sub:'privacy'},patch:{icon:'patch',label:'Nadir Patch',dom:'nadir',sub:''},holes:{icon:'fill',label:'Fill Holes',dom:'nadir',sub:'transparent areas'}};
function recompose(noUI){const s=ST();for(const k in comp)comp[k].fill(0);cloneSlots=[];patchLayer=null;
  const into=(dst,src,op)=>{for(let i=0;i<dst.length;i++){const v=src[i]*op;if(v>dst[i])dst[i]=v}};

    if(L.type==='fill'||L.type==='heal'||L.type==='holes')into(comp.fill,L.mask,op);

    else if(L.type==='blur'){into(comp.blur,L.mask,op);blurLod=L.params.amount;blurMode=L.params.mode;pixDeg=L.params.amount*.25}
    else if(L.type==='clone'&&L.M&&cloneSlots.length<3){const k='c'+cloneSlots.length;into(comp[k],L.mask,op);cloneSlots.push(L);L.slot=k}

/* ---------------- undo / history ---------------- */

let stroke=null;

/* ---------------- actions ---------------- */

    lbl.onpointerup=()=>{lbl.onpointermove=null;if(cfg.get()!==start)cfg.set(cfg.get(),true)}};

  inp.onfocus=()=>{el.classList.add('focus');setTimeout(()=>inp.select(),0)};inp.onblur=()=>{el.classList.remove('focus');const v=parseFloat(inp.value.replace(',','.'));if(!isNaN(v))set(v,true);else refreshField(id)};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'||e.key==='Escape'){if(e.key==='Escape')refreshField(id);inp.blur();cv.focus()}
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const st=cfg.step*(e.shiftKey?10:e.altKey?.1:1);set(cfg.get()+(e.key==='ArrowUp'?st:-st),true)}}})}

const mm=$('#mmCanvas'),mmx=mm.getContext('2d');const ov=document.createElement('canvas');ov.width=512;ov.height=256;const ovx=ov.getContext('2d');const ovData=ovx.createImageData(512,256);

function drawMM(){const s=ST();if(!s)return;const W=mm.width,H=mm.height;mmx.clearRect(0,0,W,H);if(s.img2k)mmx.drawImage(s.img2k,0,0,W,H);

    mmx.lineWidth=2*DPR;mmx.strokeStyle='rgba(255,255,255,.9)';mmx.shadowColor='rgba(0,0,0,.6)';mmx.shadowBlur=3;mmx.beginPath();let prev=null;
    for(const p of pts){const d=screenToDir(p[0],p[1]);if(!d){prev=null;continue}const[lo,la]=dir2ll(d);const x=(lo/(2*Math.PI)+.5)*W,y=(.5-la/Math.PI)*H;if(prev&&Math.abs(x-prev[0])<W/2)mmx.lineTo(x,y);else mmx.moveTo(x,y);prev=[x,y]}

  tipT=setTimeout(()=>{tip.innerHTML=el.dataset.tip;tip.classList.toggle('rich',!!el.dataset.tipRich);tip.classList.add('show');const r=el.getBoundingClientRect(),t=tip.getBoundingClientRect();let x,y;
    if(el.dataset.tipPos==='right'){x=r.right+10;y=r.top+r.height/2-t.height/2}else if(r.top>innerHeight/2){x=r.left+r.width/2-t.width/2;y=r.top-t.height-8}else{x=r.left+r.width/2-t.width/2;y=r.bottom+8}
    tip.style.left=Math.max(8,Math.min(innerWidth-t.width-8,x))+'px';tip.style.top=Math.max(8,y)+'px'},el.dataset.tipRich?250:450)});
document.addEventListener('pointerdown',hideTip);

/* ---------------- misc ---------------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.innerHTML=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2600)}
let badgeT;function badge(t){const b=$('#badge');b.textContent=t;b.classList.add('show');clearTimeout(badgeT);badgeT=setTimeout(()=>{if(!showOrig)b.classList.remove('show')},1000)}
let saveT;function saveTick(){const e=$('#saveState');e.classList.add('busy');e.lastChild.textContent='Saving…';clearTimeout(saveT);saveT=setTimeout(()=>{e.classList.remove('busy');e.lastChild.textContent='Saved'},600)}
function setBusy(t){const e=$('#busy');if(t){e.lastChild.textContent=t;e.classList.add('show')}else e.classList.remove('show')}
$('#zenPill').innerHTML=`Zen mode · ${kc('Tab')} exit · ${kc('rmb')} tools · ${kc('mod+K')} commands`;
let zenSeen=false;function toggleZen(){document.body.classList.toggle('zen');hideTip();const on=document.body.classList.contains('zen');if(on&&!zenSeen){zenSeen=true;toast(`Panels hidden – everything stays reachable via ${kc('rmb')} and ${kc('mod+K')}`)}}

/* ---------------- viewport input ---------------- */
let space=false,drag=null,mouse={x:-1,y:-1,in:false},vel={yaw:0,pitch:0},lastMove=0,altDown=false;
function updateCursor(){const t=TT(tool.id),paintable=t.paint&&cam.mode!==2;cv.style.cursor=space||drag&&drag.kind==='look'?'grabbing':tool.id==='nav'?'grab':paintable?'none':tool.id==='patch'?'ew-resize':'default'}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.focus();if(e.button===2){openMarking(e.clientX,e.clientY);cv.setPointerCapture(e.pointerId);return}
  const t=TT(tool.id);const look=e.button===1||(e.button===0&&(tool.id==='nav'||space));anim=null;vel={yaw:0,pitch:0};
  if(look&&cam.mode!==2){drag={kind:'look',x:e.clientX,y:e.clientY,t:performance.now()};cv.setPointerCapture(e.pointerId);updateCursor();return}
  if(e.button!==0)return;
  if(tool.id==='patch'&&cam.mode!==2){const L=ensurePatch();drag={kind:'patch',x:e.clientX,start:L.params.rot,before:{...L.params},L};cv.setPointerCapture(e.pointerId);return}
  if(t.paint&&cam.mode!==2){const d=screenToDir(e.clientX,e.clientY);if(!d)return;const s=ST();
    if(e.shiftKey&&s.lastPaint&&s.lastPaint.tool===tool.id&&tool.id!=='clone'){if(beginStroke(s.lastPaint.dir,e)){moveStroke(d);endStroke()}return}
    if(beginStroke(d,e)){drag={kind:'paint'};cv.setPointerCapture(e.pointerId)}}});
cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;altDown=e.altKey;if(mk||!drag)return;
  if(drag.kind==='look'){
    // degrees per pixel at screen centre; velocity smoothed + capped to avoid jumpy inertia
    const k=cam.mode===1?Math.min(cam.fov,180)/CH:2*Math.atan(Math.tan(cam.fov*D2R/2)/(CH/2))*R2D/2;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;const now=performance.now(),dt=Math.max(8,now-lastMove);lastMove=now;
    const dyaw=-dx*k*(cam.mode===1&&cam.pitch<-60?-1:1),dp=dy*k;cam.yaw+=dyaw;cam.pitch=Math.max(-90,Math.min(90,cam.pitch+dp));
    const cap=v=>Math.max(-2.5,Math.min(2.5,v));vel={yaw:cap(vel.yaw*.6+dyaw/dt*16*.4),pitch:cap(vel.pitch*.6+dp/dt*16*.4)}}
  else if(drag.kind==='patch'){let r=drag.start+(e.clientX-drag.x)*.4;if(e.shiftKey){r=Math.round(r/15)*15;badge('Snapped '+Math.round(wrap180(r))+'°')}drag.L.params.rot=wrap180(r);refreshField('prot')}
  else if(drag.kind==='paint'&&stroke){const d=screenToDir(e.clientX,e.clientY);if(d)moveStroke(d)}});
cv.addEventListener('pointerup',e=>{if(mk){if(performance.now()-mk.t0<220&&!mk.moved){mk.sticky=true;return}closeMarking(true);return}
  if(!drag)return;const k=drag.kind;
  if(k==='paint')endStroke();
  if(k==='patch'){const L=drag.L,b=drag.before,a={...L.params};if(a.rot!==b.rot)pushUndo({label:'Rotate nadir patch',icon:'patch',dom:'nadir',undo(){Object.assign(L.params,b)},redo(){Object.assign(L.params,a)}});renderLayers();renderHistory();renderHeader()}
  if(k==='look'){if(e.shiftKey&&Math.abs(cam.pitch)<6){animTo({pitch:0},250);badge('Snapped to horizon')}if(performance.now()-lastMove>50)vel={yaw:0,pitch:0}}
  drag=null;updateCursor()});
cv.addEventListener('pointerleave',()=>{mouse.in=false});
cv.addEventListener('dblclick',e=>{if(cam.mode===2){const d=screenToDir(e.clientX,e.clientY);if(!d)return;const[lo,la]=dir2ll(d);cam.mode=0;cam.fov=80;animTo({yaw:lo*R2D,pitch:la*R2D},500);renderNav();renderOpts()}});
cv.addEventListener('wheel',e=>{e.preventDefault();
  if(e.altKey){if(tool.id==='patch'){const L=ensurePatch();L.params.radius=Math.max(2,Math.min(45,L.params.radius*Math.exp(-e.deltaY*.002)));refreshField('prad')}else{tool.size=Math.max(.2,Math.min(40,tool.size*Math.exp(-e.deltaY*.002)));refreshField('size')}return}
  if(cam.mode===2)return;anim=null;cam.fov=Math.max(12,Math.min(fovMax(),cam.fov*Math.exp(e.deltaY*.0012)))},{passive:false});
window.addEventListener('keydown',e=>{if($('#palette').classList.contains('open'))return;if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const mod=e.metaKey||e.ctrlKey,k=e.key;if(e.key==='Alt')altDown=true;
  if(mod&&k.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(mod&&k.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k.toLowerCase()==='e'){e.preventDefault();openExport();return}
  if(mod&&k.toLowerCase()==='g'){e.preventDefault();groupSelected();return}
  if(mod&&k.toLowerCase()==='o'){e.preventDefault();toast('Open folder (mockup)');return}
  if(mod)return;
  if($('#exportDlg').classList.contains('open')){if(k==='Enter')$('#exGo').click();if(k==='Escape')$('#exportDlg').classList.remove('open');return}
  if(k===' '){e.preventDefault();if(!space){space=true;updateCursor()}return}
  if(k==='Tab'){e.preventDefault();toggleZen();return}
  if(k==='Escape'){closeMarking(false);closeMenu();$('#toolPop').classList.remove('open');$('#keysDlg').classList.remove('open');return}
  if(k==='?'){openKeys();return}
  if(k==='y'||k==='Y'||k==='\\'){if(!e.repeat&&!showOrig)setOriginal(true);return}
  if(k==='['||k===']'||e.code==='BracketLeft'||e.code==='BracketRight'){const f=(k===']'||e.code==='BracketRight')?1.15:1/1.15;
    if(tool.id==='patch'){const L=ensurePatch();L.params.radius=Math.max(2,Math.min(45,L.params.radius*f));refreshField('prad')}else{tool.size=Math.max(.2,Math.min(40,tool.size*f));refreshField('size')}return}
  if(k==='Enter'){fillSelection();return}
  if(k==='Backspace'||k==='Delete'){if(!clearSelection()){const s=ST();const L=s.layers.find(l=>l.id===s.selLayer);if(L)deleteLayer(L)}return}
  if(k==='1')return goView('nadir');if(k==='2')return goView('horizon');if(k==='3')return goView('zenith');
  if(/^[4-9]$/.test(k))return goSaved(+k-4);
  if(k==='l'||k==='L')return setMode(cam.mode===1?0:1);if(k==='f'||k==='F')return setMode(cam.mode===2?0:2);
  const t=TOOLS.find(t=>t.key&&t.key.toLowerCase()===k.toLowerCase());if(t)setTool(t.id)});
window.addEventListener('keyup',e=>{if(e.key===' '){space=false;updateCursor()}if(e.key==='y'||e.key==='Y'||e.key==='\\')setOriginal(false);if(e.key==='Alt')altDown=false});

/* ---------------- render loop ---------------- */
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR;cv.height=CH*DPR;const r=mm.getBoundingClientRect();mm.width=Math.round(r.width*DPR);mm.height=Math.round(r.width/2*DPR)}
window.addEventListener('resize',resize);
let frameN=0;
function frame(now){requestAnimationFrame(frame);stepAnim(now);
  if(!drag&&!anim&&(Math.abs(vel.yaw)>.01||Math.abs(vel.pitch)>.01)){cam.yaw+=vel.yaw;cam.pitch=Math.max(-90,Math.min(90,cam.pitch+vel.pitch));vel.yaw*=.9;vel.pitch*=.9}
  if(cam.mode===0)cam.pitch=Math.max(-89.99,Math.min(89.99,cam.pitch));cam.fov=Math.min(cam.fov,fovMax());
  if(stroke)flushStroke();
  gl.viewport(0,0,cv.width,cv.height);const{f,r,u}=basis();
  gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform3fv(U.uF,f);gl.uniform3fv(U.uR,r);gl.uniform3fv(U.uU,u);gl.uniform1f(U.uFov,cam.fov*D2R);gl.uniform1i(U.uMode,cam.mode);
  const fr=flatRect();gl.uniform4f(U.uFlat,fr.x*DPR,(CH-fr.y-fr.h)*DPR,fr.w*DPR,fr.h*DPR);
  const s=cur&&ST();const t=TT(tool.id);const paint=t.paint&&cam.mode!==2&&mouse.in&&!mk&&!(drag&&drag.kind==='look')&&!space;const cd=mouse.in?screenToDir(mouse.x,mouse.y):null;
  const pickSrc=tool.id==='clone'&&s&&!s.cloneSrc;
  gl.uniform3fv(U.uCur,cd||[0,1,0]);gl.uniform1f(U.uCurR,tool.size*D2R);gl.uniform1f(U.uCurOn,paint&&cd&&!pickSrc?1:0);
  gl.uniform1f(U.uCurMode,(tool.id==='eraser'||(tool.id==='brush'&&altDown))?1:0);
  let c2on=0,c2=[0,1,0];if(s&&tool.id==='clone'&&paint&&cd){if(pickSrc){c2=cd;c2on=1}else if(s.cloneSrc.layer&&s.cloneSrc.layer.M&&s.layers.includes(s.cloneSrc.layer)){c2=mulM(s.cloneSrc.layer.M,cd);c2on=1}else{c2=s.cloneSrc.dir;c2on=1}}
  gl.uniform3fv(U.uCur2,c2);gl.uniform1f(U.uCur2On,c2on);
  gl.uniform1f(U.uOrig,showOrig?1:0);gl.uniform1f(U.uHiOn,hoverLayer?1:0);gl.uniform1f(U.uTime,now/1000);
  gl.uniform1f(U.uShadowGain,shadowGain);gl.uniform1f(U.uBlurLod,blurLod);gl.uniform1i(U.uBlurMode,blurMode);gl.uniform1f(U.uPix,pixDeg*D2R);
  if(patchLayer){const p=patchLayer.params;gl.uniform4f(U.uPatch,1,p.radius*D2R,p.rot*D2R,patchLayer.opacity);gl.uniform1i(U.uPatchMode,p.mode);
    const hx=p.color||'#141518';gl.uniform3f(U.uPatchCol,parseInt(hx.slice(1,3),16)/255,parseInt(hx.slice(3,5),16)/255,parseInt(hx.slice(5,7),16)/255)}else gl.uniform4f(U.uPatch,0,.1,0,0);
  const on=[0,0,0];cloneSlots.forEach((L,i)=>{on[i]=1;gl.uniformMatrix3fv(U['uM'+i],false,colMajor(L.M))});gl.uniform3fv(U.uCOn,on);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if((frameN++&1)===0){drawMM();['yaw','pitch','fov'].forEach(refreshField)}}

/* ---------------- boot ---------------- */
resize();renderRail();renderNav();loadImage(IMAGES[0]).then(resize);requestAnimationFrame(frame);
setTimeout(()=>toast(`Tip: ${kc('rmb')} anywhere for the tool menu · ${kc('?')} for all shortcuts`),1200);
</script>
