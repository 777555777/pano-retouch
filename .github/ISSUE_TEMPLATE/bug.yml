name: Bug
description: Something does not work as specified
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, hardware, image size/format
