[package]
name = "s4-metadata"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike S4: lossless EXIF/XMP/GPano/ICC round trip (throw-away code)"

[dependencies]
little_exif = "0.6.23"
xmp_toolkit = "1.12.1"
lcms2 = "6.2.0"
moxcms = "0.9.1"
tiff = "0.11.3"
exr = "1.74.2"
zune-jpeg = "0.5.15"
zune-core = "0.5"
jpeg-encoder = "0.7.1"
rayon = "1.12.0"
half = "2.7.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 3
