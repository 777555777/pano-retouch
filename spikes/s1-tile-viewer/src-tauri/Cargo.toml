[package]
name = "s1-tile-viewer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "s1-tile-viewer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "s1_tile_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# C dependencies; only switched off to type-check the Windows code from macOS
# (`cargo check --target x86_64-pc-windows-msvc --no-default-features`).
default = ["native"]
native = ["dep:mozjpeg", "dep:mimalloc"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mozjpeg = { version = "0.10.13", optional = true }
zune-jpeg = "0.5.15"
lz4_flex = "0.14.0"
dirs = "7.0.0"
libc = "0.2.191"
parking_lot = "0.13.0"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
rayon = "1.12.0"
tiff = "0.11.3"
exr = "1.74.2"
half = { version = "2.7.1", features = ["bytemuck"] }
mimalloc = { version = "0.1.52", optional = true }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["net", "sync", "rt", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = false

# Image work is unusable without optimisation, even in `tauri dev`.
[profile.dev]
opt-level = 3
debug = "line-tables-only"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
