<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike S1 – tile viewer</title>
    <style>
      :root { color-scheme: dark; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
      .panel { position: fixed; background: rgba(20, 22, 26, 0.86); border: 1px solid #333; border-radius: 8px;
        padding: 10px; backdrop-filter: blur(8px); }
      #controls { top: 10px; left: 10px; width: 330px; display: grid; gap: 6px; }
      #controls label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #controls select, #controls input[type="number"] { width: 150px; background: #222; color: #ddd;
        border: 1px solid #444; border-radius: 4px; padding: 2px 4px; font: inherit; }
      #controls select#file { width: 100%; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      button { background: #2b3440; color: #e6edf3; border: 1px solid #445; border-radius: 4px; padding: 4px 8px;
        font: inherit; cursor: pointer; }
      button:hover { background: #36424f; }
      #hud { top: 10px; right: 10px; white-space: pre; min-width: 360px; }
      #log { bottom: 10px; left: 10px; right: 10px; max-height: 22vh; overflow: auto; white-space: pre; margin: 0;
        color: #9aa; }
      .hint { color: #889; }
      body.nohud .panel { display: none; }
    </style>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="controls" class="panel">
      <select id="file"></select>
      <div class="row">
        <button id="open">Open</button>
        <label><input type="checkbox" id="usecache" checked /> use cache</label>
        <label><input type="checkbox" id="writecache" checked /> write cache</label>
      </div>
      <label>layout <select id="layout"><option value="equirect">equirect atlas</option><option value="cube">cube-map LOD</option></select></label>
      <label>tile format <select id="wire"><option value="auto">auto (u8 SDR / f16 HDR)</option><option value="u8">u8</option><option value="f16">f16</option></select></label>
      <label>transport <select id="transport"><option value="protocol">custom URI scheme</option><option value="ipc">ipc::Response</option></select></label>
      <label>JPEG decoder <select id="jpeg"><option value="turbo">libjpeg-turbo</option><option value="zune">zune-jpeg</option></select></label>
      <label>GPU tile slots <input type="number" id="slots" value="384" min="32" max="2048" step="32" /></label>
      <label>max in-flight <input type="number" id="inflight" value="24" min="1" max="64" /></label>
      <label>uploads / frame <input type="number" id="uploads" value="16" min="1" max="64" /></label>
      <label>LOD bias <input type="number" id="bias" value="0" step="0.25" /></label>
      <label>fade (ms) <input type="number" id="fade" value="150" step="50" min="0" /></label>
      <label>exposure (EV, HDR) <input type="number" id="exposure" value="0" step="0.5" /></label>
      <div class="row">
        <label><input type="checkbox" id="prefetch" checked /> prefetch</label>
        <label><input type="checkbox" id="aniso" checked /> pole taps</label>
        <label><input type="checkbox" id="debug" /> level tint (D)</label>
      </div>
      <label>tool <select id="tool"><option value="navigate">navigate (V)</option><option value="mask">mask brush (B)</option><option value="clone">clone stamp (S, ⌥-click = source)</option></select></label>
      <label>brush hardness <input type="number" id="hardness" value="0.6" step="0.1" min="0" max="1" /></label>
      <div class="row">
        <button id="bopen">Bench open</button>
        <button id="bbrush">Bench brush</button>
        <button id="bpath">Bench path</button>
        <button id="btransport">Bench transport</button>
      </div>
      <div class="row">
        <button id="clear">Clear cache</button>
        <button id="copy">Copy log</button>
      </div>
      <div class="hint">drag = look (with a tool: right-drag / space) · [ ] = brush size · wheel = zoom · 1 = 1:1 · 0 = horizon · n = nadir · h = hide UI</div>
    </div>
    <div id="hud" class="panel"></div>
    <pre id="log" class="panel"></pre>
  </body>
</html>
